       ====================================================================== -->
  <main data-project-root>
    <section class="project-detail-header" data-project-header></section>

    <section class="project-detail-body">
      <div class="container">
        <div class="project-detail-layout">

        </div>

    <section class="related-projects" data-project-related></section>
  </main>
